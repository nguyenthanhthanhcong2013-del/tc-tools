<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NEXORA</title>

<style>
body{margin:0;background:#0b0b0f;color:white;font-family:Arial}
header{display:flex;justify-content:space-between;padding:10px 20px;background:#111}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:35px}
.search input{padding:8px;border-radius:10px;border:none}
.box{margin:20px;padding:20px;background:#15151d;border-radius:12px}
.item{background:#1f1f2a;margin:10px;padding:15px;border-radius:10px;cursor:pointer}
.item:hover{background:#00d4ff;color:black}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="/logo.png">
<b>NEXORA</b>
</div>

<div class="search">
<input id="search" placeholder="Search..." oninput="doSearch()">
</div>

<div>
<select onchange="setLang(this.value)">
<option value="vi">VI</option>
<option value="en">EN</option>
<option value="ja">JP</option>
<option value="fr">FR</option>
</select>
<button onclick="openLogin()">Login</button>
</div>
</header>

<div class="box">
<h2 data-t="opt">🧠 Tối ưu</h2>

<div class="item" onclick="download('clean')">
Dọn rác - <span id="clean">0</span>
</div>

<div class="item" onclick="download('ram')">
RAM - <span id="ram">0</span>
</div>
</div>

<div class="box">
<h2 data-t="game">🎮 Gaming</h2>

<div class="item" onclick="download('fps')">
FPS - <span id="fps">0</span>
</div>
</div>

<!-- LOGIN -->
<div id="loginBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;justify-content:center;align-items:center;">
<div style="background:#111;padding:20px;border-radius:10px">
<input id="user" placeholder="user"><br><br>
<input id="pass" type="password" placeholder="pass"><br><br>
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>
</div>

<script src="script.js"></script>

</body>
</html>
